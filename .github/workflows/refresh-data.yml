name: Refresh publication data

# Mondays at 03:17 UTC (08:47 IST). The odd minute is deliberate: GitHub drops
# scheduled runs when too many fire on the same tick, and :00 is the busiest.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write             # the job commits refreshed data back to the repo

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch ORCID works and Google Scholar figures
        id: refresh
        run: python tools/refresh_data.py

      - name: Commit if anything changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No change this week — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Weekly data refresh: $(date -u +%Y-%m-%d)"
          git push
          echo "Committed."

      # Scholar blocks datacenter addresses often enough that a failed fetch is
      # routine rather than broken. The script keeps the previous figures and
      # exits 0; this step just makes the situation visible in the run summary
      # instead of leaving a green tick over stale numbers.
      - name: Report source health
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          m = json.load(open("data/metrics.json"))
          print("### Data refresh\n")
          print("| figure | value |")
          print("|---|---|")
          for k in ("scholar_items", "citations", "h_index", "i10_index",
                    "orcid_works", "orcid_journal_articles"):
              if k in m:
                  print(f"| {k} | {m[k]} |")
          print("\n| source | status | last ok |")
          print("|---|---|---|")
          for name, s in (m.get("sources") or {}).items():
              print(f"| {name} | {s.get('status')} | {s.get('last_ok') or s.get('fetched') or '—'} |")
          PY
